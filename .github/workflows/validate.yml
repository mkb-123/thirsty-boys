name: Validate trips

# Runs on every push and pull request. Checks the trip config (trips.json,
# each trip file, common.json, rules) so a typo in a JSON edit fails here
# instead of silently breaking the live site.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate trip config
        run: node tests/validate.js
